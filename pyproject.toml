[project]
name = "agent-media-workspace"
version = "0.1.0"
description = "Research, comment collection and content asset tools for copywriting"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pillow>=11.3,<13",
  "yt-dlp[default]>=2026.7.4",
]

[project.scripts]
material-scout = "material_scout.cli:main"
comment-scout = "comment_scout.cli:main"
zhihu-scout = "zhihu_scout.cli:main"
breakfast-assistant = "breakfast_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/material_scout", "src/comment_scout", "src/zhihu_scout", "src/breakfast_assistant"]

[tool.uv]
package = true
