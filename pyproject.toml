[project]
name = "agent-media-workspace"
version = "0.1.0"
description = "Local transcription and media automation helpers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "faster-whisper>=1.2,<2",
  "pillow>=11.3,<13",
  "pysubs2>=1.8,<2",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
]

[project.scripts]
material-scout = "material_scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/material_scout"]

[tool.uv]
package = true
